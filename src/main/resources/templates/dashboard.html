<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>El Algarrobo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
</head>


<body>

    <header>
        <h1>El Algarrobo</h1>
        <div style="display:flex; align-items:center; gap:16px;">
            <span sec:authentication="name">Usuario</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-ghost" style="color:#ffffff;">Cerrar sesión</button>
            </form>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">

            <ul>

            <li><a href="/">Dashboard</a></li>

            <li><a href="/clientes">Clientes</a></li>

            <li><a href="/muebles">Muebles</a></li>

            <li><a href="/pedidos">Pedidos</a></li>

            <li><a href="/usuarios">Usuarios</a></li>

            </ul>

        </aside>


        <main class="content">

            <h2>Bienvenido al sistema de la carpinteria Algarrobo</h2>

            <div class="cards">

                 <div class="card">
                <h3>Clientes</h3>
                <p>Administrar clientes.</p>
            </div>

            <div class="card">
                <h3>Muebles</h3>
                <p>Administrar catálogo.</p>
            </div>

            <div class="card">
                <h3>Pedidos</h3>
                <p>Gestionar pedidos.</p>
            </div>

            <div class="card">
                <h3>Usuarios</h3>
                <p>Gestionar usuarios.</p>
            </div>

            </div>

        </main>

    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
