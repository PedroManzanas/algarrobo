<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalle del Mueble</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="container">

        <h1>Detalle del mueble</h1>

        <div class="card">

            <h2 th:text="${mueble.nombre}"></h2>

            <p>
                <strong>Categoría:</strong>
                <span th:text="${mueble.categoria}"></span>
            </p>

            <p>
                <strong>Material:</strong>
                <span th:text="${mueble.material}"></span>
            </p>


            <p>
                <strong>Descripción:</strong>
            </p>

            <p th:text="${mueble.descripcion}">
            </p>


            <p>
                <strong>Características:</strong>
            </p>

            <p th:text="${mueble.caracteristicas}">
            </p>


            <p>
                <strong>Precio:</strong>
                $
                <span th:text="${mueble.precio}"></span>
            </p>


            <a th:href="@{/muebles}" class="btn btn-secondary">
                Volver al catálogo
            </a>

        </div>

    </div>

</body>

</html>
