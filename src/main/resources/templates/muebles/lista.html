<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Muebles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>


<body>

    <header>
        <h1>El Algarrobo</h1>
        <div style="display:flex; align-items:center; gap:16px;">
            <span sec:authentication="name">Usuario</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-ghost" style="color:#ffffff;">Cerrar sesión</button>
            </form>
        </div>
    </header>

    <div class="layout-container">
        <aside class="sidebar">

            <ul>

            <li><a href="/">Dashboard</a></li>
            <li><a href="/clientes">Clientes</a></li>
            <li><a href="/muebles">Muebles</a></li>
            <li><a href="/pedidos">Pedidos</a></li>
            <li sec:authorize="hasRole('ADMIN')"><a href="/usuarios">Usuarios</a></li>

            </ul>

        </aside>


        <main class="content">

            <h2> Muebles </h2>
            <span sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/muebles/nuevo}" class="btn btn-nuevo">
                Nuevo Mueble
            </a>
            </span>

            <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"> </div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"> </div>

            <form th:action="@{/muebles}" method="get" class="row g-3 mb-3">

                <div class="col-md-6">
                    <input type="text" name="nombre" th:value="${nombre}" class="form-control" placeholder="Buscar por nombre">
                </div>

                <div class="col-auto">
                    <button class="btn btn-primary" type="submit">
                        Buscar
                    </button>
                </div>

                <div class="col-auto">
                    <a th:href="@{/muebles}" class="btn btn-secondary">
                        Mostrar todos
                    </a>
                </div>

            </form>



            <table>

                <thead class="tabla-muebles">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Categoria</th>
                        <th>Material</th>
                        <th>Precio</th>
                        <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="mueble : ${muebles}">
                        <td th:text="${mueble.id}"></td>
                        <td th:text="${mueble.nombre}"></td>
                        <td th:text="${mueble.categoria}"></td>
                        <td th:text="${mueble.material}"></td>
                        <td th:text="'$' + ${#numbers.formatDecimal(mueble.precio, 1, 2)}"></td>
                     
                        <td>
                            <span sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/muebles/editar/{id}(id=${mueble.id})}" class="btn btn-secondary">
                                    Editar</a>
                                    
                                <form th:action="@{/muebles/eliminar/{id}(id=${mueble.id})}" method="post"
                                      onclick="return confirm('¿Está seguro de que desea eliminar este mueble?');" >
                                <button type="submit" class="btn btn-danger">
                                    Eliminar
                                </button>
                                </form>
                            </span>
                        </td>

                    </tr>
                </tbody>
            </table>

                <footer>
                <p> 2026 Carpinteria Algarrobo. Alvaro Sanchez Romano. Email alvarosanchezromano.31@gmail.com. DNI 46.292.594</p>
                </footer>
        </main>

    </div>

</body>
</html>
