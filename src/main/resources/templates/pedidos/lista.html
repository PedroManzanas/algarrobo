<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


<body>

    <header>
        <h1>El Algarrobo</h1>
        <span>Administrador</span>
    </header>

    <div class="container">
        <aside class="sidebar">

            <ul>

            <li><a href="/">Dashboard</a></li>
            <li><a href="/clientes">Clientes</a></li>
            <li><a href="/muebles">Muebles</a></li>
            <li><a href="/pedidos">Pedidos</a></li>
            <li><a href="/usuarios">Usuarios</a></li>

            </ul>

        </aside>


        <main class="content">

            <h2> Pedidos: </h2>
            <a th:href="@{/pedidos/nuevo}" class="btn btn-nuevo">
                Nuevo Pedido
            </a>

            <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"> </div>

            <form th:action="@{/pedidos}" method="get" class="row g-3 mb-3">

                <div class="col-md-6">
                    <input type="text" name="nombre" th:value="${nombre}" class="form-control" placeholder="Buscar por nombre del cliente">
                </div>

                <div class="col-auto">
                    <button class="btn btn-primary" type="submit">
                        Buscar
                    </button>
                </div>

                <div class="col-auto">
                    <a th:href="@{/pedidos}" class="btn btn-secondary">
                        Mostrar todos
                    </a>
                </div>

            </form>



            <table>

                <thead class="tabla-pedidos">
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Mueble</th>
                        <th>Cantidad</th>
                        <th>Fecha Solicitud</th>
                        <th>Fecha Entrega</th>
                        <th>Estado</th>
                        <th>Dejo seña?</th>
                        <th>Precio Final</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pedido : ${pedidos}">
                        <td th:text="${pedido.id}"></td>
                        <td th:text="${pedido.cliente.nombre + '' + pedido.cliente.apellido}"></td>
                        <td th:text="${pedido.mueble.nombre}"></td>
                        <td th:text="${pedido.cantidad}"></td>
                        <td th:text="${pedido.fechaSolicitud}"></td>
                        <td th:text="${pedido.fechaEntregaEstimada}"></td>
                        <td th:text="${pedido.estado}"></td>
                  <!--      <td th:text="${pedido.sena ? 'Si' : 'No'}"></td> -->
                        <td>
                            <span class="badge bg-success" th:if="${pedido.sena}">
                                Sí
                            </span>
                            <span class="badge bg-secondary" th:unless="${pedido.sena}">
                                No
                            </span>
                        </td>
                        <td th:text="${pedido.precioFinal}"></td>
                        
                        


                        <td>
                            <a th:href="@{/pedidos/editar/{id}(id=${pedido.id})}" class="btn btn-secondary">
                                Editar</a>
                            <a th:href="@{/pedidos/eliminar/{id}(id=${pedido.id})}" class="btn btn-danger"
                                  onclick="return confirm('¿Está seguro de que desea eliminar este Pedido?');" >
                                Eliminar</a>
                        </td>

                    </tr>
                </tbody>
            </table>


        </main>

    </div>

</body>
</html>
