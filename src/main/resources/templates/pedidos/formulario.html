<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Pedidos</title>
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
    <div class="form-container">
        <h1>Gestión de Pedidos</h1>
        
        <form method="post" th:action="@{/pedidos}" th:object="${pedido}">
            
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="cliente">Cliente:</label>
                <select class="form-select" th:field="*{cliente}" required>
                    <option value="">Seleccione un cliente</option>
                    <option
                        th:each="cliente : ${clientes}"
                        th:value="${cliente.id}"
                        th:text="${cliente.nombre + ' ' + cliente.apellido}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="mueble">Mueble:</label>
                <select class="form-select" th:field="*{mueble}" required>
                    <option value="">Seleccione un mueble</option>
                    <option th:each="mueble : ${muebles}"
                            th:value="${mueble.id}"
                            th:text="${mueble.nombre}">

                    </option>
                </select>
               
            </div>

            <div class="form-group">
                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" min="1" th:field="*{cantidad}" required>
            </div>

            <div class="form-group">
                <label for="fechaSolicitud">Fecha de Solicitud:</label>
                <input type="date" id="fechaSolicitud" th:field="*{fechaSolicitud}" required>
            </div>        

            <div class="form-group">
                <label for="fechaEntregaEstimada">Fecha de Entrega Estimada:</label>
                <input type="date" id="fechaEntregaEstimada" th:field="*{fechaEntregaEstimada}" required>
            </div>
            
            <div class="form-check">
                <label for="form-check-label">Se dejo seña</label>
                <input class="form-check-input" type="checkbox" id="sena" th:field="*{sena}">
            </div>

            <div class="form-group">
                <label for="estado">Estado:</label>
                <select class="form-select" th:field="*{estado}" required>
                    <option th:each="estado : ${estados}"
                            th:value="${estado}"
                            th:text="${estado}">
                    </option>
                </select>
            </div>
            
            <button class="btn btn-primary" th:text="${pedido.id == null}
            ? 'Guardar'
            : 'Actualizar'">
            </button> 
            
            <button type="reset" class="btn-secondary">Limpiar Formulario</button>

            <a th:href="@{/pedidos}" class="btn-secondary"> 
             Volver
            </a>
         
        </form>     
    </div>
</body>
</html>
