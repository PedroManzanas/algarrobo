<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
         <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>


<body>
    <header>
        <h1>El Algarrobo</h1>
    </header>
 
    <div class="form-container" style="max-width: 420px;">
        <span class="form-eyebrow">Acceso al sistema</span>
        
        <h2>Iniciar Sesión</h2>
        <p class="form-subtitle">Ingresá tus datos para acceder al panel de gestión.</p>
    
        <div class="error-message" style="margin-bottom: 16px;" th:if="${param.error}">
        Usuario, contraseña o captcha incorrectos.
        </div>

        <div class="error-message" style="margin-bottom: 16px;" th:if="${param.captchaError}">
        La respuesta del captcha no es correcta.
        </div>

        <p style="color: var(--terracota); font-size: 13.5px; margin-bottom: 16px;" th:if="${param.logout}">
        Sesión cerrada correctamente.
        </p>

        <form th:action="@{/login}" method="post" class="form">
            <div class="form-group">
                <label for="username">Nombre de usuario:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="captcha" th:text="'Verificación: ' + ${captchaPregunta}">Verificación</label>
                <input type="text" id="captcha" name="captcha" required autocomplete="off">
            </div>

            <div>
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </div>
        </form>
    </div>

</body>
</html>
