<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<body>

    <header>
        <h1>El Algarrobo</h1>
        <span>Administrador</span>
    </header>

    <div class="container">
        <aside class="sidebar">

            <ul>

            <li><a href="/">Dashboard</a></li>
            <li><a href="/clientes">Clientes</a></li>
            <li><a href="/muebles">Muebles</a></li>
            <li><a href="/pedidos">Pedidos</a></li>
            <li><a href="/usuarios">Usuarios</a></li>

            </ul>

        </aside>


        <main class="content">

            <h2> Clientes </h2>
            <a th:href="@{/clientes/nuevo}" class="btn btn-nuevo">
                Nuevo Cliente
            </a>

            <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"> </div>

            <table>

                <thead class="tabla-clientes">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Teléfono</th>
                        <th>Dirección</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.id}"></td>
                        <td th:text="${cliente.nombre}"></td>
                        <td th:text="${cliente.apellido}"></td>
                        <td th:text="${cliente.telefono}"></td>
                        <td th:text="${cliente.direccion}"></td>

                        <td>
                            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-secondary">
                                Editar</a>
                            <a th:href="@{/clientes/eliminar/{id}(id=${cliente.id})}" class="btn btn-danger"
                                  onclick="return confirm('¿Está seguro de que desea eliminar este cliente?');" >
                                Eliminar</a>
                        </td>

                    </tr>
                </tbody>
            </table>
