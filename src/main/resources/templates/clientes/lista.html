<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


<body>

    <header>
        <h1>El Algarrobo</h1>
        <span>Administrador</span>
    </header>

    <div class="container">
        <aside class="sidebar">

            <ul>

            <li><a href="/">Dashboard</a></li>
            <li><a href="/clientes">Clientes</a></li>
            <li><a href="/muebles">Muebles</a></li>
            <li><a href="/pedidos">Pedidos</a></li>
            <li><a href="/usuarios">Usuarios</a></li>

            </ul>

        </aside>


        <main class="content">

            <h2> Clientes </h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#clienteModal">
             Nuevo Cliente
            </button>

             
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Teléfono</th>
                        <th>Dirección</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.id}"></td>
                        <td th:text="${cliente.nombre}"></td>
                        <td th:text="${cliente.apellido}"></td>
                        <td th:text="${cliente.telefono}"></td>
                        <td th:text="${cliente.direccion}"></td>

                        <td>
                            <button>Editar</button>
                            <button>Eliminar</button>
                        </td>

                    </tr>
                </tbody>
            </table>

            <div class="modal fade" id="clienteModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">

                            <h5 class="modal-title">
                                Nuevo Cliente
                            </h5>

                            <button type="button" class="btn-close" data-bs-dismiss="modal"> </button>

                        </div>

                        <form th:action="@{/clientes}" method="post">

                            <div class="modal-body">

                                <div class="mb-3">
                                    <label class="form-label">
                                        Nombre
                                    </label>
                                    <input class="form-control" name="nombre" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        Apellido
                                    </label>
                                    <input class="form-control" name="apellido" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        Teléfono
                                    </label>
                                    <input class="form-control" name="telefono" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        Dirección
                                    </label>
                                    <input class="form-control" name="direccion">
                                </div>
                            </div>

                            <div class="modal-footer">

                                <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">
                                    Cancelar
                                </button>

                                <button class="btn btn-success" type="submit">
                                    Guardar
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>



        </main>

    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
