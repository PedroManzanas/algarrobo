<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Clientes</title>
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
    <div class="container">
        <h1>Gestión de Clientes</h1>
        
        <form method="post" th:action="@{/clientes}" th:object="${cliente}">
            
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" th:field="*{nombre}" required>
            </div>

            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" th:field="*{apellido}" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" th:field="*{telefono}" required>
            </div>

            <div class="form-group">
                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" th:field="*{direccion}" required>
            </div>        


            
            <button class="btn btn-success"
            th:text="${cliente.id == null}
            ? 'Guardar'
            : 'Actualizar'">
            </button> 
            
            <button type="reset" class="btn-secondary">Limpiar Formulario</button>

            <a th:href="@{/clientes}" class="btn-secondary"> 
             >Volver
            </a>

            <h3 th:text="${cliente.id == null}
                ? 'Nuevo Cliente'
                : 'Editar Cliente'">
            </h3>

        </form>     
    </div>
</body>
</html>
