<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>

<body>
    <div class="container">
        <h1>Gestión de Usuarios</h1>
        
        <form method="post" th:action="@{/usuarios}" th:object="${usuario}">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" th:field="*{nombre}" required>
            </div>

            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" th:field="*{apellido}" required>
            </div>

            <div class="form-group">
                <label for="username">Nombre de Usuario:</label>
                <input type="text" id="username" th:field="*{username}" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                        <input type="password" id="password" th:field="*{password}"
                        th:required="${usuario.id == null}"
                        th:placeholder="${usuario.id == null} ? '' : 'Dejar en blanco para no cambiarla'">

            </div>

        <div class="form-group">
          <label for="rol">Rol</label>
            <select id="rol" th:field="*{rol}" required>
                <option value="" disabled th:if="${usuario.rol == null}" selected>Seleccione un rol</option>
                <option th:each="rolOpcion : ${roles}"
                        th:value="${rolOpcion}"
                        th:text="${rolOpcion}">
                </option>
            </select>
         </div>
        
         <div class="form-group">

            <button class="btn btn-primary" th:text="${usuario.id == null}
            ? 'Guardar'
            : 'Actualizar'">
            </button> 
            
            <button type="reset" class="btn-secondary">Limpiar Formulario</button>

            <a th:href="@{/usuarios}" class="btn-secondary"> 
             Volver
            </a>
         </div>
        </form>     
    </div>
</body>
</html>
